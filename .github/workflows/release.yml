---
# inspo: https://github.com/LGUG2Z/nixos-wsl-starter/blob/master/.github/workflows/build.yml
name: "Release custom WSL tarball and NixOS ISO"
on:
  push:
    tags:
      - v*
  workflow_dispatch: null
jobs:
  build-wsl:
    runs-on: ubuntu-latest
    steps:
      - name: Check free space
        run: |
          echo "Free space:"
          df -h

      # inspo: https://carlosbecker.com/posts/github-actions-disk-space/
      - name: Node cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Check free space
        run: |
          echo "Free space:"
          df -h

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Build tarball
        run: |
          nix_bin=$(which nix)
          sudo $nix_bin run .#nixosConfigurations.win1chng.config.system.build.tarballBuilder

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: nixos.wsl
          path: nixos.wsl

  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Check free space
        run: |
          echo "Free space:"
          df -h

      # inspo: https://carlosbecker.com/posts/github-actions-disk-space/
      - name: Node cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Check free space
        run: |
          echo "Free space:"
          df -h

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Build ISO
        run: |
          nix_bin=$(which nix)
          sudo $nix_bin build .#nixosConfigurations.iso1chng.config.system.build.isoImage

      - name: Rename ISO
        run: sudo mv result/iso/nixos-*.iso nixos.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: nixos.iso
          path: nixos.iso

  release:
    needs:
      - build-wsl
      - build-iso
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v8
        with:
          name: nixos.wsl
          path: .

      - name: Release tarball
        uses: softprops/action-gh-release@v3
        with:
          files: nixos.wsl
          fail_on_unmatched_files: true

      # Keep only one release asset on disk at a time.
      - name: Remove uploaded tarball
        run: rm -- nixos.wsl

      - name: Download ISO
        uses: actions/download-artifact@v8
        with:
          name: nixos.iso
          path: .

      - name: Release ISO
        uses: softprops/action-gh-release@v3
        with:
          files: nixos.iso
          fail_on_unmatched_files: true

      - name: Remove uploaded ISO
        run: rm -- nixos.iso
