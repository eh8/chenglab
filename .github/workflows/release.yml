---
name: "Release custom NixOS ISO"
on:
  push:
    tags:
      - v*
  workflow_dispatch: null
jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Check free space
        run: |
          echo "Free space:"
          df -h

      # inspo: https://carlosbecker.com/posts/github-actions-disk-space/
      - name: Node cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Check free space
        run: |
          echo "Free space:"
          df -h

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Build ISO
        run: |
          nix_bin=$(which nix)
          sudo $nix_bin build .#nixosConfigurations.iso1chng.config.system.build.isoImage

      - name: Rename ISO
        run: sudo mv result/iso/nixos-*.iso nixos.iso

      - name: Validate ISO size
        run: |
          size=$(stat --format=%s nixos.iso)
          echo "ISO size: $size bytes"
          if (( size >= 2147483648 )); then
            echo "::error::ISO exceeds GitHub's 2 GiB release asset limit"
            exit 1
          fi

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: nixos.iso
          path: nixos.iso
          if-no-files-found: error

  release:
    needs:
      - build-iso
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download ISO
        uses: actions/download-artifact@v8
        with:
          name: nixos.iso
          path: .

      - name: Release ISO
        uses: softprops/action-gh-release@v3
        with:
          files: nixos.iso
          fail_on_unmatched_files: true
